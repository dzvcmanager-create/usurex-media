<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:BSD;src:url(file:///home/claude/fonts/fontsource-big-shoulders-display-5.3.0/files/big-shoulders-display-latin-900-normal.woff2)}
@font-face{font-family:CP;src:url(file:///home/claude/fonts/fontsource-courier-prime-5.3.0/files/courier-prime-latin-700-normal.woff2)}
@font-face{font-family:IN;font-weight:600;src:url(file:///home/claude/fonts/inter/inter-latin-600-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0d0d0c}
svg{display:block}
.k{font-family:CP;font-size:40px;letter-spacing:6px}
.t{font-family:BSD;text-transform:uppercase}
.b{font-family:IN;font-weight:600}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="vig" cx="50%" cy="48%" r="75%">
  <stop offset="55%" stop-color="#000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#3a2210" stop-opacity=".4"/>
 </radialGradient>
 <filter id="grain"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer></filter>
 <mask id="iris"><rect width="1080" height="1920" fill="#000"/><circle id="irisC" cx="540" cy="960" r="1200" fill="#fff"/></mask>
</defs>
<g mask="url(#iris)">
 <rect width="1080" height="1920" fill="#F3F0E9" id="bg"/>
 <!-- sunburst rays -->
 <g id="rays" opacity=".06"></g>
 <!-- ground -->
 <ellipse id="shadow" cx="540" cy="1562" rx="230" ry="26" fill="#0d0d0c" opacity=".18"/>
 <path d="M60 1566 Q540 1548 1020 1566" stroke="#0d0d0c" stroke-width="7" fill="none" stroke-linecap="round"/>
 <g id="txt"></g>
 <g id="char"></g>
 <rect width="1080" height="1920" fill="url(#vig)"/>
 <rect width="1080" height="1920" filter="url(#grain)" id="grainR"/>
 <rect width="1080" height="1920" fill="#000" id="flick" opacity="0"/>
</g>
</svg>
<script>
const INK='#0d0d0c',PINK='#ED0A84',LIME='#C6EA12',CREAM='#F3F0E9';
const S=document.getElementById('s');
const $=id=>document.getElementById(id);
// rays
(()=>{let g='';for(let i=0;i<24;i++){const a=i*Math.PI/12,b=a+Math.PI/24;g+=`<path d="M540 1150 L${540+2200*Math.cos(a)} ${1150+2200*Math.sin(a)} L${540+2200*Math.cos(b)} ${1150+2200*Math.sin(b)}Z" fill="${INK}"/>`}$('rays').innerHTML=g})();

const SCENES=[
 {a:0,   b:3.6, disp:'¿?', kick:'VENTAS SIN PRESIÓN', title:['“LO VOY','A PENSAR”'], hl:1, sub:'3 respuestas para no perder la venta', pose:'wave'},
 {a:3.6, b:8.4, disp:'1', kick:'RESPUESTA 01', title:['PREGUNTA QUÉ','LE FALTA'], hl:1, bub:['¿Qué te falta para decidir:','el precio, el plazo','o algo del producto?'], pose:'point'},
 {a:8.4, b:13.0,disp:'2', kick:'RESPUESTA 02', title:['RESUELVE SOLO','ESA DUDA'], hl:1, bub:['Corto y concreto.','No vuelvas a','explicar todo.'], pose:'count'},
 {a:13.0,b:17.8,disp:'3', kick:'RESPUESTA 03', title:['ACUERDA CUÁNDO','VUELVES'], hl:1, bub:['¿Te escribo el jueves','y me cuentas qué','decidiste?'], pose:'point'},
 {a:17.8,b:23.0,disp:'REX', kick:'¿TE PASA EN TU NEGOCIO?', title:['COMENTA REX'], hl:0, sub:'y te digo dónde se te escapan las ventas', wa:'WhatsApp directo: +56 9 3561 3004', pose:'cash'},
];
window.SCENES=SCENES.map(s=>[s.a,s.b]);
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.9;x=Math.min(Math.max(x,0),1);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const clamp=(x,a=0,b=1)=>Math.min(Math.max(x,a),b);

function hose(x1,y1,x2,y2,bend,w){ // rubber hose limb
 const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
 const nx=-dy/L,ny=dx/L;
 return `<path d="M${x1} ${y1} Q${mx+nx*bend} ${my+ny*bend} ${x2} ${y2}" stroke="${INK}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
}
function glove(x,y,rot,pointing,sc=1){
 // generic 4-finger cartoon glove
 let f= pointing
  ? `<rect x="-6" y="-58" width="22" height="50" rx="11" fill="#fff" stroke="${INK}" stroke-width="6"/>
     <ellipse cx="0" cy="0" rx="30" ry="26" fill="#fff" stroke="${INK}" stroke-width="6"/>
     <path d="M-14 -6 q10 6 24 0" stroke="${INK}" stroke-width="5" fill="none"/>`
  : `<ellipse cx="0" cy="-4" rx="34" ry="30" fill="#fff" stroke="${INK}" stroke-width="6"/>
     <path d="M-16 -30 v-14 M-2 -33 v-16 M12 -30 v-14" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
     <ellipse cx="-30" cy="4" rx="12" ry="9" fill="#fff" stroke="${INK}" stroke-width="5"/>`;
 return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"><rect x="-26" y="18" width="52" height="16" rx="6" fill="#fff" stroke="${INK}" stroke-width="6"/>${f}</g>`;
}
function shoe(x,y,flip){
 return `<g transform="translate(${x} ${y}) scale(${flip?-1:1} 1)"><path d="M-30 0 q-4 -40 34 -42 q46 -2 58 30 q4 12 -8 12 z" fill="${INK}"/><ellipse cx="34" cy="-22" rx="12" ry="7" fill="#fff" opacity=".35"/></g>`;
}

function character(t,sc){
 const lt=t-sc.a, dur=sc.b-sc.a;
 const p=(t*2.2)%1; // bounce beat
 const hop=Math.sin(Math.PI*p);
 const squash=1-0.07*Math.max(0,Math.cos(2*Math.PI*p))+0.04*hop;
 const by=1410-hop*34; // hip line
 const cx=540+Math.sin(t*1.1)*10;
 const tilt=Math.sin(t*2.2*Math.PI)*3;
 const W=380,H=340;
 const top=by-H*squash-30;
 let o='';
 // legs
 const hipL=[cx-80,by-10],hipR=[cx+80,by-10];
 const fL=[cx-130,1556],fR=[cx+130,1556];
 const comp=(1410-by)+40;
 o+=hose(hipL[0],hipL[1],fL[0],fL[1]-8,-(60-comp*0.6),30);
 o+=hose(hipR[0],hipR[1],fR[0],fR[1]-8,(60-comp*0.6),30);
 o+=shoe(fL[0]-10,fL[1],true)+shoe(fR[0]+10,fR[1],false);
 // arms targets by pose
 const shL=[cx-W/2+14,top+H*0.55],shR=[cx+W/2-14,top+H*0.55];
 let hL,hR,rL=-20,rR=20,ptR=false,ptL=false,bL=-70,bR=70;
 const sw=Math.sin(t*9);
 if(sc.pose==='wave'){hL=[cx-250,by-60+Math.sin(t*4)*10];hR=[cx+280+sw*30,top-40+Math.abs(sw)*10];rR=sw*25;bR=-60;}
 else if(sc.pose==='point'){hL=[cx-245,by-40+Math.sin(t*4)*8];hR=[cx+290+Math.sin(t*5)*8,top-70+Math.sin(t*5)*12];rR=30;ptR=true;bR=-90;}
 else if(sc.pose==='count'){hL=[cx-280,top-20+Math.sin(t*6)*10];hR=[cx+280,top-20-Math.sin(t*6)*10];rL=-15;rR=15;ptL=true;ptR=true;bL=80;bR=-80;}
 else {const k=clamp((lt-0.4)/0.4);hL=[cx-290,top-10-k*50+Math.sin(t*8)*14];hR=[cx+290,top-10-k*50-Math.sin(t*8)*14];rL=-30;rR=30;bL=70;bR=-70;}
 const armsBack=hose(shL[0],shL[1],hL[0],hL[1]+30,bL,26)+hose(shR[0],shR[1],hR[0],hR[1]+30,bR,26);
 // body: vintage cash register
 const bx=cx-W/2;
 let body=`<g transform="rotate(${tilt} ${cx} ${by})">`;
 // drawer
 const drawerOut= sc.pose==='cash'? 55*back((lt-0.4)/0.5):0;
 body+=`<rect x="${bx-18}" y="${by-70+drawerOut*0.2}" width="${W+36}" height="70" rx="12" fill="${PINK}" stroke="${INK}" stroke-width="8"/>`;
 if(drawerOut>2){body+=`<rect x="${bx+40}" y="${by-24}" width="${W-80}" height="${drawerOut}" rx="6" fill="${LIME}" stroke="${INK}" stroke-width="7"/>`;}
 body+=`<circle cx="${cx}" cy="${by-35+drawerOut*0.2}" r="11" fill="${CREAM}" stroke="${INK}" stroke-width="6"/>`;
 // main box (trapezoid)
 const y0=top+40,y1=by-66;
 body+=`<path d="M${bx+22} ${y0} L${bx+W-22} ${y0} L${bx+W} ${y1} L${bx} ${y1} Z" fill="${CREAM}" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>`;
 body+=`<path d="M${bx+40} ${y0+14} L${bx+W-40} ${y0+14}" stroke="${PINK}" stroke-width="8" stroke-linecap="round"/>`;
 // display box on top
 body+=`<rect x="${cx-95}" y="${top-60}" width="190" height="100" rx="16" fill="${INK}" stroke="${INK}" stroke-width="8"/>
  <rect x="${cx-78}" y="${top-46}" width="156" height="72" rx="8" fill="${LIME}"/>
  <text x="${cx}" y="${top+12}" text-anchor="middle" class="t" font-size="${sc.disp.length>2?58:66}" fill="${INK}">${sc.disp}</text>`;
 // face
 const ey=y0+66, blink=(((t+1.5)%3.1)<0.12)?0.12:1;
 const look=sc.pose==='point'?[10,-10]:sc.pose==='wave'?[6,-2]:[0,-6];
 for(const s of [-1,1]){
  const ex=cx+s*62;
  body+=`<ellipse cx="${ex}" cy="${ey}" rx="38" ry="${48*blink}" fill="#fff" stroke="${INK}" stroke-width="7"/>`;
  if(blink>0.5){
   const px=ex+look[0],py=ey+8+look[1];
   body+=`<ellipse cx="${px}" cy="${py}" rx="17" ry="26" fill="${INK}"/><path d="M${px} ${py} L${px+18} ${py-20} L${px+5} ${py-28}Z" fill="#fff"/>`;
  }
 }
 // cheeks
 body+=`<ellipse cx="${cx-118}" cy="${ey+62}" rx="22" ry="13" fill="${PINK}" opacity=".55"/><ellipse cx="${cx+118}" cy="${ey+62}" rx="22" ry="13" fill="${PINK}" opacity=".55"/>`;
 // mouth (talks)
 const talking = lt>0.5 && lt<dur-0.8;
 const mo = talking? Math.abs(Math.sin(t*11))*34+6 : 10;
 const my=ey+64;
 body+=`<path d="M${cx-70} ${my} Q${cx} ${my+20+mo*1.4} ${cx+70} ${my} Q${cx} ${my+14} ${cx-70} ${my}Z" fill="${INK}"/>`;
 if(mo>16) body+=`<path d="M${cx-30} ${my+10+mo*0.9} Q${cx} ${my+mo*0.6} ${cx+30} ${my+10+mo*0.9}" fill="${PINK}"/>`;
 body+=`<path d="M${cx-86} ${my-6} q10 8 20 4 M${cx+86} ${my-6} q-10 8 -20 4" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
 // keys row
 const ky=y1-30;
 for(let i=0;i<5;i++){const kx=bx+62+i*((W-124)/4);const pr=(sc.pose==='cash'&&((Math.floor(t*8)+i)%5===0))?6:0;
  body+=`<rect x="${kx-20}" y="${ky-20+pr}" width="40" height="34" rx="9" fill="${i%2?LIME:'#fff'}" stroke="${INK}" stroke-width="6"/>`;}
 body+=`</g>`;
 // coins in cash pose
 let coins='';
 if(sc.pose==='cash'){
  for(let i=0;i<5;i++){
   const ct=(lt-0.6-i*0.35);
   if(ct>0){const u=ct%1.6;const x=cx+(i-2)*120+u*(i-2)*70;const y=by-60-Math.sin(Math.PI*Math.min(u/1.2,1))*(420+i*30)+ (u>1.2?(u-1.2)*600:0);
    if(y<1500) coins+=`<g transform="translate(${x} ${y}) rotate(${u*360})"><circle r="34" fill="${LIME}" stroke="${INK}" stroke-width="7"/><text y="16" text-anchor="middle" class="t" font-size="46" fill="${INK}">$</text></g>`;}
  }
 }
 // shadow
 $('shadow').setAttribute('rx',230-hop*40);
 return o+armsBack+body+glove(hL[0],hL[1],rL,ptL)+glove(hR[0],hR[1],rR,ptR)+coins;
}

function textLayer(t,sc){
 const lt=t-sc.a+(sc.a===0?1.2:0);
 let o='';
 const kIn=clamp((lt-0.25)/0.3);
 o+=`<g opacity="${kIn}" transform="translate(0 ${(1-ease(kIn))*20})"><rect x="90" y="150" width="${sc.kick.length*30+44}" height="58" rx="29" fill="${INK}"/><text x="112" y="191" class="k" fill="${LIME}">${sc.kick}</text></g>`;
 const lines=sc.title; let y=390;
 const fs=lines.length===1?176:140;
 lines.forEach((ln,i)=>{
  const k=back((lt-0.45-i*0.18)/0.45);
  const isHl=(i===sc.hl)||(sc.hl===0&&lines.length===1);
  const wob=Math.sin(t*6+i)*1.2;
  let txt=ln;
  if(sc.pose==='cash'){txt='COMENTA <tspan fill="'+PINK+'">REX</tspan>';}
  o+=`<g transform="translate(540 ${y}) scale(${Math.max(k,0.001)}) rotate(${wob})">`;
  if(isHl&&sc.pose!=='cash'){const w=ln.length*fs*0.44+50;o+=`<rect x="${-w/2}" y="${-fs*0.86}" width="${w}" height="${fs*1.02}" rx="14" fill="${PINK}" transform="rotate(-1.5)"/>`;}
  o+=`<text text-anchor="middle" class="t" font-size="${fs}" fill="${isHl&&sc.pose!=='cash'?CREAM:INK}" stroke="${INK}" stroke-width="${isHl&&sc.pose!=='cash'?0:0}">${txt}</text></g>`;
  y+=fs*1.06;
 });
 if(sc.sub){const k=clamp((lt-1.0)/0.35);
  o+=`<text x="540" y="${y+40}" text-anchor="middle" class="b" font-size="50" fill="${INK}" opacity="${k}">${sc.sub}</text>`; y+=60;}
 if(sc.bub){const k=back((lt-1.0)/0.4);const bw=820,bh=sc.bub.length*60+64,bxx=540-bw/2,byy=y+20;
  o+=`<g transform="translate(540 ${byy+bh/2}) scale(${Math.max(k,0.001)}) translate(-540 ${-(byy+bh/2)})">
   <rect x="${bxx+10}" y="${byy+12}" width="${bw}" height="${bh}" rx="40" fill="${INK}"/>
   <rect x="${bxx}" y="${byy}" width="${bw}" height="${bh}" rx="40" fill="#fff" stroke="${INK}" stroke-width="8"/>
   <path d="M${540+120} ${byy+bh-4} l60 70 l-10 -72z" fill="#fff" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
   <rect x="${540+112}" y="${byy+bh-14}" width="80" height="12" fill="#fff"/>`;
  sc.bub.forEach((l,i)=>{o+=`<text x="540" y="${byy+76+i*60}" text-anchor="middle" class="b" font-size="46" fill="${INK}">${l}</text>`});
  o+=`</g>`;}
 if(sc.wa){const k=back((lt-1.5)/0.4);
  o+=`<g transform="translate(540 ${y+110}) scale(${Math.max(k,0.001)})"><rect x="-400" y="-56" width="800" height="96" rx="48" fill="${INK}"/><text y="10" text-anchor="middle" class="b" font-size="44" fill="${LIME}">${sc.wa}</text></g>`;}
 // signature
 o+=`<text x="540" y="1680" text-anchor="middle" class="t" font-size="58" fill="${PINK}" opacity="${clamp((lt-0.5)/0.5)}">— BILLY · USUREX</text>`;
 return o;
}

window.render=function(t){
 const sc=SCENES.find(s=>t>=s.a&&t<s.b)||SCENES[SCENES.length-1];
 const lt=t-sc.a,dur=sc.b-sc.a;
 $('rays').setAttribute('transform',`rotate(${t*6} 540 1150)`);
 $('turb').setAttribute('seed',Math.floor(t*30)%97+1);
 $('flick').setAttribute('opacity',(0.025+0.025*Math.sin(t*53)*Math.sin(t*17)).toFixed(3));
 // iris in/out
 let r=1200;
 if(lt<0.4&&sc.a>0) r=1200*ease(lt/0.4)+1;
 const isLast=sc===SCENES[SCENES.length-1];
 if(dur-lt<0.4) r=Math.min(r,1200*ease((dur-lt)/0.4)+1);
 $('irisC').setAttribute('r',r);
 $('irisC').setAttribute('cy',isLast&&dur-lt<0.4?1150:960);
 $('txt').innerHTML=textLayer(t,sc);
 $('char').innerHTML=character(t,sc);
};
window.render(1.5);
</script></body></html>
